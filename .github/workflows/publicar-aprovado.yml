name: Publicar artigo aprovado

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publicar-artigo
  cancel-in-progress: false

jobs:
  publicar:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'rascunho/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar a versão aprovada
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Localizar os artigos da aprovação
        id: arquivos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mapfile -t FILES < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --paginate \
              --jq '.[] | select(.status == "added") | .filename' |
              grep -E '^src/data/posts/[^/]+\.md$'
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "Nenhum artigo novo foi encontrado na aprovação."
            exit 1
          fi

          printf '%s\n' "${FILES[@]}" > "$RUNNER_TEMP/artigos-aprovados.txt"

      - name: Tornar os artigos públicos
        shell: bash
        run: |
          mapfile -t FILES < "$RUNNER_TEMP/artigos-aprovados.txt"
          node scripts/publicar-rascunho.mjs "${FILES[@]}"

      - name: Conferir antes de publicar
        run: |
          pnpm validar
          pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Salvar a publicação
        shell: bash
        run: |
          git config user.name "curva-viva[bot]"
          git config user.email "curva-viva[bot]@users.noreply.github.com"
          git add src/data/posts
          git commit -m "publicar: artigo aprovado na PR #${{ github.event.pull_request.number }}"
          git push origin main
