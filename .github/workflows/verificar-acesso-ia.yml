name: Confirmar acesso da IA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verificar-acesso-ia.yml"

permissions:
  contents: read

jobs:
  confirmar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Confirmar que o acesso foi cadastrado
        shell: bash
        env:
          ACESSO_IA: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ACESSO_IA" ]; then
            echo "O segredo CLAUDE_CODE_OAUTH_TOKEN ainda não foi cadastrado."
            exit 1
          fi
          echo "O segredo foi encontrado. Agora vamos validar a conexão."

      - name: Testar a conexão sem alterar arquivos
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Este é apenas um teste de conexão.
            Leia o arquivo README.md e encerre sem alterar nenhum arquivo.
            Não execute comandos, não crie conteúdo e não faça publicações.
          claude_args: |
            --max-turns 2
            --allowedTools "Read"
