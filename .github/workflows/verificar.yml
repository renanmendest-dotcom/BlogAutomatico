name: Verificar o site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Conferir tipos e conteúdo
        run: pnpm check

      - name: Construir o site
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
