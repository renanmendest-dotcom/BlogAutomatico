<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1000px; height: 1500px; overflow: hidden; }
      body { font-family: Arial, Helvetica, sans-serif; }
      .card { position: relative; width: 1000px; height: 1500px; overflow: hidden; background: #f4eadf; }
      .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .wash { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(250,244,236,.97) 0%, rgba(250,244,236,.86) 31%, rgba(250,244,236,.08) 54%, rgba(45,20,38,.12) 100%); }
      .content { position: absolute; inset: 0; padding: 78px 72px 62px; display: flex; flex-direction: column; }
      .eyebrow { align-self: flex-start; padding: 13px 20px; border-radius: 999px; background: #a83e54; color: #fffaf4; font-size: 25px; font-weight: 800; letter-spacing: .08em; }
      h1 { max-width: 820px; margin: 30px 0 18px; color: #351d2d; font-family: Georgia, 'Times New Roman', serif; font-size: 78px; line-height: .98; letter-spacing: -.035em; }
      p { max-width: 760px; margin: 0; color: #4f3542; font-size: 33px; line-height: 1.22; font-weight: 600; }
      .footer { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
      .action { max-width: 650px; padding: 18px 24px; border-radius: 18px; background: rgba(53,29,45,.92); color: #fffaf4; font-size: 28px; font-weight: 800; line-height: 1.18; }
      .brand { display: flex; align-items: center; gap: 12px; padding: 11px 16px 11px 12px; border-radius: 999px; background: rgba(255,250,244,.95); box-shadow: 0 8px 30px rgba(53,29,45,.18); color: #351d2d; font-size: 24px; font-weight: 800; white-space: nowrap; }
      .brand img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
      .step h1 { font-size: 68px; max-width: 850px; }
      .step p { max-width: 820px; font-size: 31px; }
    </style>
  </head>
  <body>
    <main id="card" class="card"></main>
    <script>
      const cards = [
        {
          photo: '../correcao-2026-08-17/fotos/07-day-after-janela.png', eyebrow: 'CABELO ONDULADO',
          title: 'Suas ondas somem quando secam?',
          body: 'Antes de trocar todos os produtos, teste 3 ajustes simples.',
          action: 'Deslize e salve para a próxima lavagem'
        },
        {
          photo: '../correcao-2026-08-17/fotos/01-umidade-uniforme.png', eyebrow: 'AJUSTE 1',
          title: 'Finalize com o cabelo úmido por igual',
          body: 'Mechas quase secas recebem produto de forma irregular. Umedeça de novo e trabalhe por partes.',
          action: 'Mude apenas uma etapa por lavagem', step: true
        },
        {
          photo: '../correcao-2026-08-17/fotos/05-mousse-vista-superior.png', eyebrow: 'AJUSTE 2',
          title: 'Comece com menos creme',
          body: 'Raiz baixa, secagem lenta e ondas esticadas podem indicar excesso. Reduza a quantidade antes de comprar outro pote.',
          action: 'Compare o resultado só depois de secar', step: true
        },
        {
          photo: '../correcao-2026-08-17/fotos/06-difusor-lateral.png', eyebrow: 'AJUSTE 3',
          title: 'Não toque até o cabelo secar',
          body: 'A onda aparece molhada e some seca? Teste uma fixação leve e deixe o cabelo quieto.',
          action: 'Veja os 8 erros no Curva Viva', step: true
        }
      ];
      const n = Math.max(0, Math.min(3, Number(new URLSearchParams(location.search).get('card') || 0)));
      const c = cards[n];
      document.querySelector('#card').classList.toggle('step', Boolean(c.step));
      document.querySelector('#card').innerHTML = `
        <img class="photo" src="${c.photo}" alt="" />
        <div class="wash"></div>
        <section class="content">
          <div class="eyebrow">${c.eyebrow}</div>
          <h1>${c.title}</h1>
          <p>${c.body}</p>
          <div class="footer">
            <div class="action">${c.action}</div>
            <div class="brand"><img src="../../../public/logo-curva-viva.png" alt="" /> Curva Viva</div>
          </div>
        </section>`;
    </script>
  </body>
</html>
