<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1000px; height: 1500px; overflow: hidden; }
      body { font-family: Arial, Helvetica, sans-serif; background: #f8f3ec; }
      .card {
        position: relative;
        width: 1000px;
        height: 1500px;
        overflow: hidden;
        padding: 86px 72px 72px;
        background:
          radial-gradient(circle at 14% 12%, rgba(240, 210, 203, .9) 0 145px, transparent 147px),
          radial-gradient(circle at 94% 88%, rgba(194, 86, 76, .2) 0 270px, transparent 272px),
          #f8f3ec;
        color: #2b2027;
      }
      .curve {
        position: absolute;
        width: 760px;
        height: 760px;
        right: -390px;
        top: 170px;
        border: 72px solid rgba(107, 61, 94, .1);
        border-radius: 50%;
      }
      .curve.two {
        width: 560px;
        height: 560px;
        right: -275px;
        top: 270px;
        border-width: 38px;
        border-color: rgba(194, 86, 76, .14);
      }
      .logo-wrap {
        position: relative;
        display: flex;
        width: 220px;
        height: 220px;
        margin: 0 auto;
        padding: 14px;
        align-items: center;
        justify-content: center;
        border: 3px solid rgba(107, 61, 94, .16);
        border-radius: 50%;
        background: rgba(255, 255, 255, .88);
        box-shadow: 0 24px 60px rgba(71, 40, 63, .16);
      }
      .logo-wrap::after {
        content: '';
        position: absolute;
        inset: -17px;
        border: 2px solid rgba(194, 86, 76, .2);
        border-radius: 50%;
      }
      .logo-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
      .eyebrow {
        position: relative;
        margin-top: 58px;
        text-align: center;
        color: #a83e54;
        font-size: 25px;
        font-weight: 900;
        letter-spacing: .1em;
      }
      h1 {
        position: relative;
        max-width: 820px;
        margin: 24px auto 28px;
        text-align: center;
        color: #351d2d;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 76px;
        line-height: 1;
        letter-spacing: -.04em;
      }
      .intro {
        position: relative;
        max-width: 800px;
        margin: 0 auto;
        text-align: center;
        color: #4f3542;
        font-size: 33px;
        line-height: 1.3;
        font-weight: 600;
      }
      .actions {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 74px;
        padding: 42px 44px;
        text-align: center;
        border-radius: 34px;
        background: #47283f;
        box-shadow: 0 26px 70px rgba(71, 40, 63, .24);
        color: #fffaf4;
      }
      .follow {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 19px 28px;
        border-radius: 999px;
        background: #c2564c;
        font-size: 29px;
        font-weight: 900;
      }
      .follow::before { content: '＋'; font-size: 34px; line-height: 1; }
      .site-label {
        margin-top: 32px;
        color: #f0d2cb;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .site {
        margin-top: 9px;
        color: #fffaf4;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 39px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="curve"></div>
      <div class="curve two"></div>
      <div class="logo-wrap">
        <img src="../../../public/logo-curva-viva.png" alt="Logo Curva Viva" />
      </div>
      <div class="eyebrow">CONTINUE COM A GENTE</div>
      <h1>Quer saber mais sobre <span id="tema">seu cabelo natural</span>?</h1>
      <p class="intro">
        Siga a Curva Viva no Pinterest para acompanhar dicas simples, respostas
        honestas e novos conteúdos sobre esse assunto.
      </p>
      <section class="actions">
        <div class="follow">Siga @curvavivaoficial</div>
        <div class="site-label">Leia os conteúdos completos</div>
        <div class="site">www.curvaviva.com.br</div>
      </section>
    </main>
    <script>
      const tema = new URLSearchParams(location.search).get('tema');
      if (tema) document.querySelector('#tema').textContent = tema;
    </script>
  </body>
</html>
