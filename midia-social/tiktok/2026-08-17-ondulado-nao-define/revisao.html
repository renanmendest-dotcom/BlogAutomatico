<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 2160px; height: 1440px; overflow: hidden; background: #24141f; }
      main { display: grid; grid-template-columns: repeat(4, 540px); grid-template-rows: repeat(2, 720px); }
      img { display: block; width: 540px; height: 720px; object-fit: contain; }
    </style>
  </head>
  <body>
    <main>
      <img src="slide-01.png" alt="" /><img src="slide-02.png" alt="" />
      <img src="slide-03.png" alt="" /><img src="slide-04.png" alt="" />
      <img src="slide-05.png" alt="" /><img src="slide-06.png" alt="" />
      <img src="slide-07.png" alt="" /><img src="slide-08.png" alt="" />
    </main>
  </body>
</html>
