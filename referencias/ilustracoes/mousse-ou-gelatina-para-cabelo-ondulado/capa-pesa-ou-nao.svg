  <path d="M840 228 C770 330 748 375 748 432 C748 522 816 570 880 570 C948 570 1015 518 1015 432 C1015 373 977 317 908 228Z" fill="#F0D2CB" stroke="#C2564C" stroke-width="7"/>
  <text x="320" y="438" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#47283F">MOUSSE</text>
  <text x="320" y="486" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" fill="#2B2027">Bom começo para</text>
  <text x="320" y="522" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" fill="#2B2027">movimento e distribuição</text>
  <text x="880" y="438" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#47283F">GELATINA</text>
  <text x="880" y="486" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" fill="#2B2027">Bom começo para</text>
  <text x="880" y="522" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" fill="#2B2027">sustentação e duração</text>
  <rect x="165" y="665" width="870" height="74" rx="37" fill="#47283F"/>
  <text x="600" y="712" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#F8F3EC">A fórmula e a dose importam mais do que o nome</text>
