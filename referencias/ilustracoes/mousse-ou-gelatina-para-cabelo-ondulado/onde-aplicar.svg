<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#F8F3EC"/>
  <text x="600" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="700" fill="#47283F">O que o cabelo seco está pedindo?</text>
  <text x="600" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" fill="#6B3D5E">Observe o sinal antes de trocar a rotina inteira</text>
  <rect x="90" y="190" width="470" height="205" rx="32" fill="#F0D2CB" stroke="#C2564C" stroke-width="5"/>
  <text x="130" y="242" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#47283F">Raiz baixa e secagem lenta</text>
  <text x="130" y="292" font-family="Inter,Arial,sans-serif" font-size="25" fill="#2B2027">Retire uma camada cremosa</text>
  <text x="130" y="330" font-family="Inter,Arial,sans-serif" font-size="25" fill="#2B2027">e teste mousse sozinho</text>
  <circle cx="500" cy="337" r="27" fill="#C2564C"/>
  <path d="M488 337 L498 347 L516 325" fill="none" stroke="#F8F3EC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="640" y="190" width="470" height="205" rx="32" fill="#EFE5D9" stroke="#6B3D5E" stroke-width="5"/>
  <text x="680" y="242" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#47283F">Onda bonita que abre cedo</text>
  <text x="680" y="292" font-family="Inter,Arial,sans-serif" font-size="25" fill="#2B2027">Teste gelatina em camada fina</text>
  <text x="680" y="330" font-family="Inter,Arial,sans-serif" font-size="25" fill="#2B2027">sem tocar durante a secagem</text>
  <circle cx="1050" cy="337" r="27" fill="#6B3D5E"/>
  <path d="M1038 337 L1048 347 L1066 325" fill="none" stroke="#F8F3EC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="90" y="440" width="470" height="205" rx="32" fill="#EFE5D9" stroke="#6B3D5E" stroke-width="5"/>
  <text x="130" y="492" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#47283F">Pontas ásperas e com nós</text>
  <text x="130" y="542" font-family="Inter,Arial,sans-serif" font-size="25" fill="#2B2027">Use pouca base só nas pontas</text>
  <text x="130" y="580" font-family="Inter,Arial,sans-serif" font-size="25" fill="#2B2027">antes de escolher o fixador</text>
  <circle cx="500" cy="587" r="27" fill="#6B3D5E"/>
  <path d="M1038 587 L1048 597 L1066 575" fill="none" stroke="#F8F3EC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(-550 0)"/>
  <rect x="640" y="440" width="470" height="205" rx="32" fill="#F0D2CB" stroke="#C2564C" stroke-width="5"/>
  <text x="680" y="492" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#47283F">Rigidez que não cede</text>
  <text x="680" y="542" font-family="Inter,Arial,sans-serif" font-size="25" fill="#2B2027">Reduza a dose e use mais água</text>
  <text x="680" y="580" font-family="Inter,Arial,sans-serif" font-size="25" fill="#2B2027">antes de somar outro produto</text>
  <circle cx="1050" cy="587" r="27" fill="#C2564C"/>
  <path d="M1038 587 L1048 597 L1066 575" fill="none" stroke="#F8F3EC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="220" y="690" width="760" height="62" rx="31" fill="#47283F"/>
  <text x="600" y="730" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#F8F3EC">Mude uma etapa por vez e avalie só depois de seco</text>
</svg>
