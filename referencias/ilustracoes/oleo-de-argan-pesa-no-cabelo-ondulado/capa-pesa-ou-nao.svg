  <text x="320" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#6B3D5E">Tende a ficar leve</text>
  <path d="M155 410 C205 330 265 490 320 410 C375 330 435 490 485 410" fill="none" stroke="#6B3D5E" stroke-width="16" stroke-linecap="round"/>
  <circle cx="320" cy="520" r="48" fill="#C2564C"/>
  <path d="M320 478 C292 520 294 550 320 563 C346 550 348 520 320 478Z" fill="#F8F3EC"/>
  <text x="320" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#2B2027">pouca quantidade</text>
  <rect x="640" y="230" width="480" height="430" rx="32" fill="#F0D2CB" stroke="#C2564C" stroke-width="5"/>
  <text x="880" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#47283F">Pode pesar</text>
  <path d="M715 445 C765 365 825 525 880 445 C935 365 995 525 1045 445" fill="none" stroke="#47283F" stroke-width="24" stroke-linecap="round"/>
  <circle cx="815" cy="540" r="34" fill="#C2564C"/><circle cx="880" cy="540" r="34" fill="#C2564C"/><circle cx="945" cy="540" r="34" fill="#C2564C"/>
  <text x="880" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#2B2027">muitas camadas</text>
  <rect x="230" y="705" width="740" height="62" rx="31" fill="#6B3D5E"/>
  <text x="600" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#F8F3EC">Comece pequeno e avalie só depois de secar</text>
