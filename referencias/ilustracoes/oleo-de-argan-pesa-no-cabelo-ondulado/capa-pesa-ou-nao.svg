<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#F8F3EC"/>
  <text x="80" y="110" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#47283F">Óleo de argan pesa nas ondas?</text>
  <text x="80" y="166" font-family="Arial, sans-serif" font-size="30" fill="#2B2027">O resultado depende mais da dose e das camadas do que do nome “óleo”.</text>
