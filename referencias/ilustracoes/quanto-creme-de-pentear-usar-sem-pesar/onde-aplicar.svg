    <text x="464" y="540" text-anchor="middle" font-size="30" font-weight="700" fill="#47283F">Espalhe pouco</text>
    <text x="464" y="578" text-anchor="middle" font-size="22" fill="#2B2027">uma camada nas mãos</text>
    <rect x="614" y="205" width="245" height="405" rx="28" fill="#F0D2CB" stroke="#C2564C" stroke-width="5"/>
    <circle cx="736" cy="280" r="48" fill="#47283F"/><text x="736" y="297" text-anchor="middle" font-size="46" font-weight="700" fill="#F8F3EC">3</text>
    <path d="M700 345 C675 390 675 465 700 505 M736 345 C711 390 711 465 736 505 M772 345 C747 390 747 465 772 505" fill="none" stroke="#6B3D5E" stroke-width="13" stroke-linecap="round"/>
