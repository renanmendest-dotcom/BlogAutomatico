    <text x="1008" y="540" text-anchor="middle" font-size="30" font-weight="700" fill="#47283F">Decida</text>
    <text x="1008" y="578" text-anchor="middle" font-size="22" fill="#2B2027">só então acrescente</text>
    <rect x="110" y="675" width="980" height="64" rx="32" fill="#47283F"/>
    <text x="600" y="716" text-anchor="middle" font-size="24" font-weight="700" fill="#F8F3EC">Falta em uma região? Corrija a região, não o cabelo inteiro</text>
