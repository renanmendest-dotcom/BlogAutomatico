    <text x="736" y="578" text-anchor="middle" font-size="22" fill="#2B2027">termine uma seção</text>
    <rect x="886" y="205" width="245" height="405" rx="28" fill="#EFE5D9" stroke="#6B3D5E" stroke-width="5"/>
    <circle cx="1008" cy="280" r="48" fill="#47283F"/><text x="1008" y="297" text-anchor="middle" font-size="46" font-weight="700" fill="#F8F3EC">4</text>
    <path d="M948 420 H1068 M1040 392 L1068 420 L1040 448" fill="none" stroke="#6B3D5E" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
