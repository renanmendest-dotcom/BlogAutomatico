    <path d="M140 405 C150 335 235 335 245 405 M192 345 V500" fill="none" stroke="#6B3D5E" stroke-width="13" stroke-linecap="round"/>
    <path d="M155 385 L230 445 M230 385 L155 445" stroke="#C2564C" stroke-width="8"/>
    <text x="192" y="540" text-anchor="middle" font-size="30" font-weight="700" fill="#47283F">Divida</text>
    <text x="192" y="578" text-anchor="middle" font-size="19" fill="#2B2027">alcance as partes internas</text>
    <rect x="342" y="205" width="245" height="405" rx="28" fill="#EFE5D9" stroke="#6B3D5E" stroke-width="5"/>
    <circle cx="464" cy="280" r="48" fill="#47283F"/><text x="464" y="297" text-anchor="middle" font-size="46" font-weight="700" fill="#F8F3EC">2</text>
    <path d="M405 425 C420 360 508 360 523 425" fill="none" stroke="#6B3D5E" stroke-width="18" stroke-linecap="round"/>
