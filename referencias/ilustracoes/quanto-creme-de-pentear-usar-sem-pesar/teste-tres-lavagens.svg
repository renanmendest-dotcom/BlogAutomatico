<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#F8F3EC"/>
  <text x="600" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="700" fill="#47283F">O cabelo secou: o que ajustar?</text>
  <text x="600" y="128" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" fill="#6B3D5E">Um sinal orienta o próximo teste, não uma conclusão apressada</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="185" width="510" height="225" rx="28" fill="#F0D2CB" stroke="#C2564C" stroke-width="5"/>
    <circle cx="145" cy="260" r="38" fill="#47283F"/>
    <path d="M120 305 C130 245 160 245 170 305" fill="none" stroke="#6B3D5E" stroke-width="13"/>
    <text x="210" y="250" font-size="31" font-weight="700" fill="#47283F">Raiz baixa e colada</text>
    <text x="210" y="296" font-size="24" fill="#2B2027">Reduza no topo e afaste</text>
    <text x="210" y="330" font-size="24" fill="#2B2027">a aplicação do couro cabeludo</text>
    <rect x="620" y="185" width="510" height="225" rx="28" fill="#EFE5D9" stroke="#6B3D5E" stroke-width="5"/>
    <path d="M690 250 H775 M690 290 H748 M690 330 H720" stroke="#6B3D5E" stroke-width="14" stroke-linecap="round"/>
    <text x="810" y="250" font-size="31" font-weight="700" fill="#47283F">Sem movimento</text>
    <text x="810" y="296" font-size="24" fill="#2B2027">Retire uma camada da rotina</text>
    <text x="810" y="330" font-size="24" fill="#2B2027">antes de trocar o creme</text>
    <rect x="70" y="445" width="510" height="225" rx="28" fill="#EFE5D9" stroke="#6B3D5E" stroke-width="5"/>
    <circle cx="150" cy="535" r="52" fill="none" stroke="#6B3D5E" stroke-width="12"/>
    <path d="M150 535 V500 M150 535 L180 555" stroke="#C2564C" stroke-width="11" stroke-linecap="round"/>
    <text x="230" y="510" font-size="31" font-weight="700" fill="#47283F">Secagem lenta</text>
    <text x="230" y="556" font-size="24" fill="#2B2027">Use menos creme e mantenha</text>
    <text x="230" y="590" font-size="24" fill="#2B2027">a técnica para comparar</text>
    <rect x="620" y="445" width="510" height="225" rx="28" fill="#F0D2CB" stroke="#C2564C" stroke-width="5"/>
    <path d="M690 580 C720 480 765 480 795 580" fill="none" stroke="#6B3D5E" stroke-width="16" stroke-linecap="round"/>
    <path d="M745 585 L785 625" stroke="#C2564C" stroke-width="10" stroke-linecap="round"/>
    <text x="830" y="510" font-size="31" font-weight="700" fill="#47283F">Pontas ásperas</text>
    <text x="830" y="556" font-size="24" fill="#2B2027">Reumedeça e acrescente</text>
    <text x="830" y="590" font-size="24" fill="#2B2027">apenas onde ainda falta</text>
    <rect x="100" y="705" width="1000" height="58" rx="29" fill="#47283F"/>
    <text x="600" y="742" text-anchor="middle" font-size="24" font-weight="700" fill="#F8F3EC">Mude uma variável por lavagem e compare o resultado seco</text>
  </g>
</svg>
